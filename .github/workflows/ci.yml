name: CI/CD Release Governance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-governance:
    name: Stage 0 - Conventional Commit Format Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source History
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Verify Conventional Commit Format (AGENTS.md Section 9)
        run: |
          node -e '
            const cp = require("child_process");
            const logs = cp.execSync("git log -n 5 --format=%s").toString().trim().split("\n");
            const pattern = /^(feat|fix|refactor|style|chore|test|docs|ci|perf)(\([a-zA-Z0-9_\-\.\/]+\))?:\s.+/;
            for (const msg of logs) {
              if (!pattern.test(msg)) {
                console.error(`[COMMIT LINT ERROR] Invalid commit message: "${msg}"`);
                console.error("Must follow: <type>(<scope>): <description>");
                process.exit(1);
              }
              console.log(`[COMMIT LINT PASS] Valid: "${msg}"`);
            }
          '

  static-checks:
    name: Stage 1 - Static Checks & Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Component Line Ceiling (CC-02 / NFR-009)
        run: npm run audit:lines

      - name: Strict TypeScript Compilation (CC-01)
        run: npm run typecheck

      - name: ESLint Code Quality Gate
        run: npm run lint

  security-compliance:
    name: Stage 2 - Security & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Specification Boundary & Zero Leak Gate (BND-04 / INC-2026-001)
        run: npm run audit:leak

      - name: Scan Secrets & Leaked Credentials
        run: npm run audit:secrets

      - name: Audit Dependency Vulnerabilities
        run: npm audit --audit-level=high

  unit-tests:
    name: Stage 3 - Automated Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Node Native Unit Tests
        run: npm run test:unit

  build:
    name: Stage 4 - Deterministic Production Build
    needs: [commit-governance, static-checks, security-compliance, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Audit Performance & Bundle Budgets
        run: npm run audit:bundle

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: |
            .next/
            public/
            package.json
          retention-days: 3

  e2e-smoke:
    name: Stage 5 - Production E2E Smoke & Route Health
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Execute Route Smoke Probe
        run: |
          npm run start &
          PID=$!
          echo "Server started with PID: $PID"
          
          # Wait for server to become reachable
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Server ready after $i seconds."
              break
            fi
            sleep 1
          done

          npm run test:smoke
          kill $PID
        env:
          APP_URL: http://127.0.0.1:3000
