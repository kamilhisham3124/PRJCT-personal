name: CI/CD Release Governance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-governance:
    name: Stage 0 - Conventional Commit Format Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source History
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Verify Conventional Commit Format (AGENTS.md Section 9)
        run: |
          node -e '
            const cp = require("child_process");
            const logs = cp.execSync("git log -n 5 --format=%s").toString().trim().split("\n");
            const pattern = /^(feat|fix|refactor|style|chore|test|docs|ci|perf)(\([a-zA-Z0-9_\-\.\/]+\))?:\s.+/;
            for (const msg of logs) {
              if (!pattern.test(msg)) {
                console.error(`[COMMIT LINT ERROR] Invalid commit message: "${msg}"`);
                console.error("Must follow: <type>(<scope>): <description>");
                process.exit(1);
              }
              console.log(`[COMMIT LINT PASS] Valid: "${msg}"`);
            }
          '

  static-checks:
    name: Stage 1 - Static Checks & Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Component Line Ceiling (CC-02 / NFR-009)
        run: npm run audit:lines

      - name: Strict TypeScript Compilation (CC-01)
        run: npm run typecheck

      - name: ESLint Code Quality Gate
        run: npm run lint

  security-compliance:
    name: Stage 2 - Security & Specification Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Specification Boundary & Zero Leak Gate (BND-04 / INC-2026-001)
        run: npm run audit:leak

  unit-tests:
    name: Stage 3 - Automated Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Node Native Unit Tests
        run: npm run test:unit

  build:
    name: Stage 4 - Deterministic Production Build
    needs: [commit-governance, static-checks, security-compliance, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
